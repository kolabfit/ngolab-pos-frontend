<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Style for Background Animation -->
    <style>
        .animated-bg {
            background: linear-gradient(270deg, #1a1a2e, #090e1c, #ff7700, #000000);
            background-size: 800% 800%;
            animation: gradientBG 10s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Custom styles for the hover effect on the nav links */
        .nav-link-custom {
            border: 2px solid transparent;
            transition: border-color 0.3s ease, color 0.3s ease;
        }
        .nav-link-custom:hover {
            border-color: #ff7700;
            color: #ff7700;
        }
    </style>
</head>
<body class="animated-bg text-white min-vh-100 d-flex flex-column">

    <!-- Navigation -->
    <nav class="bg-dark py-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="login.html" class="fs-4 fw-bold text-white text-decoration-none">
                POS Ngolab
            </a>
            <ul class="nav">
                <li class="nav-item">
                    <a href="login.html" class="nav-link nav-link-custom px-3 text-white">
                        Login
                    </a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link nav-link-custom px-3 text-white">
                        Register
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow d-flex pt-5 justify-content-center align-items-center">
        <div class="bg-dark p-4 rounded shadow-lg" style="max-width: 40%; width: 100%;">
            <h2 class="text-center fs-3 fw-bold mb-4">Login</h2>

            <form method="POST" action="login.html">
                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail Address</label>
                    <input id="email" type="email" class="form-control bg-secondary text-white border-0" name="email" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" class="form-control bg-secondary text-white border-0" name="password" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" id="remember" name="remember" class="form-check-input">
                    <label for="remember" class="form-check-label">Remember Me</label>
                </div>

                <button type="submit" class="btn btn-warning w-100">Login</button>
            </form>
        </div>
    </main>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
