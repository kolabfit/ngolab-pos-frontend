<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Style for Background Animation -->
    <link rel="stylesheet" href="css/intro.css">
</head>
<body class="animated-bg text-white min-vh-100 d-flex flex-column">

    <!-- Navigation -->
    <nav class="bg-dark py-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="fs-4 fw-bold text-white no-underline">
                POS Ngolab
            </a>
            <ul class="nav">
                <li class="nav-item">
                    <a href="index.html" class="nav-link px-3 text-white">
                        Login
                    </a>
                </li>
                <li class="nav-item">
                    <a href="register.html" class="nav-link px-3 text-white">
                        Register
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow d-flex justify-content-center align-items-center middle-card">
        <div class="bg-dark p-4 rounded shadow-lg" style="max-width: 40%; width: 100%;">
            <h2 class="text-center fs-3 fw-bold mb-4">Register</h2>

            <form method="POST" action="index.html">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input id="name" type="text" class="form-control bg-secondary text-white border-0" name="name" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail Address</label>
                    <input id="email" type="email" class="form-control bg-secondary text-white border-0" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" class="form-control bg-secondary text-white border-0" name="password" required>
                </div>

                <div class="mb-3">
                    <label for="password-confirm" class="form-label">Confirm Password</label>
                    <input id="password-confirm" type="password" class="form-control bg-secondary text-white border-0" name="password_confirmation" required>
                </div>

                <button type="submit" class="btn btn-warning w-100">Register</button>
            </form>
        </div>
    </main>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
